# =============================================================================
# AI Selenium Framework — Application Configuration
# =============================================================================
# All values here are defaults. Any key can be overridden by:
#   1. A system environment variable  (highest priority)
#   2. A .env file entry              (medium priority)
#   3. The value in this file         (lowest / default)
# =============================================================================

# ── Application Under Test 
# Base URL of the application. Change this to switch environments.
# Examples:
#   BASE_URL=https://the-internet.herokuapp.com   (staging / default)
#   BASE_URL=https://qa.myapp.com                 (QA environment)
#   BASE_URL=http://localhost:8080                 (local dev)
BASE_URL=https://the-internet.herokuapp.com

# ── Page Paths (relative to BASE_URL)
LOGIN_PATH=/login
SECURE_PATH=/secure

# ── Test Credentials 
# Tip: for sensitive passwords use a .env file or CI secrets, not this file.
LOGIN_USERNAME=tomsmith
LOGIN_PASSWORD=SuperSecretPassword!

# Invalid credentials are fixture data for the negative-login test.
INVALID_LOGIN_USERNAME=wronguser
INVALID_LOGIN_PASSWORD=wrongpass

# ── Browser / Driver Settings 
BROWSER=chrome
HEADLESS=false
WINDOW_WIDTH=1440
WINDOW_HEIGHT=900

# ── Timeouts (seconds) 
IMPLICIT_WAIT=0
EXPLICIT_WAIT=15
PAGE_LOAD_TIMEOUT=30
